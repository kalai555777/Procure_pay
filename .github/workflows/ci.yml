name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code, with full history for gitleaks
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.7"

      - name: Lock file matches pyproject.toml
        run: uv lock --check

      - name: Install the project and its tools from the lock file
        run: uv sync --locked

      - name: Ruff format
        run: uv run --frozen ruff format --check .

      - name: Ruff check
        run: uv run --frozen ruff check .

      - name: mypy
        run: uv run --frozen mypy

      - name: Export the locked dependencies for pip-audit
        run: uv export --frozen --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/requirements-audit.txt"

      - name: pip-audit (known vulnerabilities in the locked dependencies)
        run: uv run --frozen pip-audit --disable-pip -r "$RUNNER_TEMP/requirements-audit.txt"

      - name: Secrets in the whole history (gitleaks)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --verbose /repo

  arm-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Get the code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build the ARM image
        run: docker build --platform linux/arm64 -t procure-pay:ci .

      - name: Check the image is ARM
        run: test "$(docker image inspect procure-pay:ci --format '{{.Architecture}}')" = "arm64"

      - name: Run the tests with coverage inside the image
        run: docker run --rm -e COVERAGE_FILE=/tmp/.coverage procure-pay:ci pytest
