[project]
name = "procure-pay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kalai Arun Balu", email = "208873107+kalai555777@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "sqlalchemy>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff==0.17.3",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C90", "D"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=procure_pay --cov-report=term-missing --cov-fail-under=80"

[tool.ruff.lint.pydocstyle]
convention = "google"
